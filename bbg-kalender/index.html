<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BBG Kalender"><meta name="theme-color" content="#c87882"><title>BBG Träningskalender</title><style>:root{--bg:#f8f3f2;--card:#fff;--text:#2f292a;--muted:#786f70;--accent:#c87882;--accent-soft:#f2dfe2;--border:#e7dbdd;--done:#eaf5ec;--done-border:#b8d7bd;--shadow:0 8px 24px rgba(77,48,52,.07)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:18px 15px 100px}.hero{background:linear-gradient(145deg,#fff,#f4e6e8);border:1px solid var(--border);border-radius:24px;padding:20px}h1{font-size:28px;line-height:1.1;margin:0 0 6px}h2{font-size:20px;margin:0}p{margin:0;color:var(--muted)}.controls{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px;align-items:end}.field{font-size:13px;color:var(--muted)}.datebox{display:flex;width:100%;margin-top:6px;padding:11px;border:1px solid var(--border);border-radius:14px;background:#fff}input[type=date]{width:100%;min-width:0;border:0;background:transparent;padding:0;font:inherit}button{border:0;border-radius:13px;padding:12px 15px;font:inherit;font-weight:700;background:var(--accent);color:#fff}button.secondary{background:#eee5e6;color:var(--text)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:15px 0}.stat{background:#fff;border:1px solid var(--border);border-radius:16px;padding:13px 8px;text-align:center}.stat strong{display:block;font-size:23px}.stat span{font-size:11px;color:var(--muted)}.progress-track{height:11px;background:#eadfe0;border-radius:99px;overflow:hidden}.progress-bar{height:100%;width:0;background:var(--accent);transition:.25s}.tabs{display:flex;gap:8px;overflow:auto;padding:18px 0 6px}.tab{white-space:nowrap;background:#fff;color:var(--text);border:1px solid var(--border);padding:10px 13px}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.week-panel{display:none;margin-top:12px}.week-panel.active{display:block}.week-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.badge{font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:7px 10px;border-radius:99px}.pass-card{display:flex;gap:13px;align-items:flex-start;background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;margin-bottom:11px;box-shadow:var(--shadow);transition:.2s}.pass-card.done{background:var(--done);border-color:var(--done-border)}.pass-card.optional{border-style:dashed}.pass-card input{width:26px;height:26px;accent-color:var(--accent);margin-top:2px;flex:0 0 auto}.pass-main{flex:1;min-width:0}.pass-day{font-size:13px;color:var(--muted)}.pass-title{font-size:18px;font-weight:800;margin-top:2px}.pass-card.done .pass-title{text-decoration:line-through;opacity:.68}.pass-desc{font-size:14px;color:var(--muted);margin-top:5px}.optional-chip{display:inline-block;margin-left:7px;font-size:11px;background:var(--accent-soft);color:var(--accent);padding:3px 7px;border-radius:99px}.note{background:#fff;border:1px solid var(--border);border-radius:18px;padding:16px;margin-top:20px}textarea{width:100%;min-height:95px;margin-top:9px;border:1px solid var(--border);border-radius:13px;padding:11px;font:inherit}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(248,243,242,.94);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:9px 15px calc(9px + env(safe-area-inset-bottom))}.bottom-inner{max-width:720px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:13px}.install{font-size:13px;line-height:1.45;margin-top:16px}@media(max-width:480px){.controls{grid-template-columns:1fr}.controls button{width:100%}}</style></head><body><main class="app"><section class="hero"><h1>BBG Pre-Training</h1><p>3 träningspass per vecka + ett valfritt söndagspass</p><div class="controls"><label class="field">När börjar vecka 1?<span class="datebox"><input id="startDate" type="date"></span></label><button id="todayBtn" type="button">Börja idag</button></div></section><section class="stats"><div class="stat"><strong id="mainDone">0</strong><span>av 12 huvudpass</span></div><div class="stat"><strong id="bonusDone">0</strong><span>bonuspass</span></div><div class="stat"><strong id="weeksDone">0</strong><span>hela veckor</span></div></section><div class="progress-track"><div id="progressBar" class="progress-bar"></div></div><nav class="tabs" aria-label="Välj vecka"><button class="tab active" data-week="1">Vecka 1</button><button class="tab" data-week="2">Vecka 2</button><button class="tab" data-week="3">Vecka 3</button><button class="tab" data-week="4">Vecka 4</button></nav><div id="panels"></div><section class="note"><h2>Anteckningar</h2><textarea id="notes" placeholder="Hur gick passen? Vikter, energi, antal varv …"></textarea><div style="margin-top:10px"><button id="resetBtn" class="secondary" type="button">Nollställ allt</button></div></section><p class="install">På iPhone: öppna sidan i Safari, tryck på delningssymbolen och välj <strong>Lägg till på hemskärmen</strong>.</p></main><footer class="bottom"><div class="bottom-inner"><strong id="footerText">0 av 12 huvudpass</strong><button id="nextBtn" type="button">Nästa pass</button></div></footer><script>const weeks=[1,2,3,4].map(week=>({week,subtitle:`Pre-Training vecka ${week}`,passes:[{offset:0,day:"Måndag",title:"Pass 1",desc:`BBG Pre-Training vecka ${week}`,optional:false},{offset:2,day:"Onsdag",title:"Pass 2",desc:`BBG Pre-Training vecka ${week}`,optional:false},{offset:4,day:"Fredag",title:"Pass 3",desc:`BBG Pre-Training vecka ${week}`,optional:false},{offset:6,day:"Söndag",title:"Optional pass",desc:"Valfritt bonuspass",optional:true}]}));const KEY="bbg-simple-v2",DATEKEY="bbg-simple-date-v2",NOTESKEY="bbg-simple-notes-v2";let state=JSON.parse(localStorage.getItem(KEY)||"{}");const panels=document.getElementById("panels"),startDate=document.getElementById("startDate");startDate.value=localStorage.getItem(DATEKEY)||"";function formatDate(weekIndex,offset,fallback){if(!startDate.value)return fallback;const d=new Date(startDate.value+"T12:00:00");d.setDate(d.getDate()+weekIndex*7+offset);return d.toLocaleDateString("sv-FI",{weekday:"long",day:"numeric",month:"short"})}function render(){panels.innerHTML="";weeks.forEach((w,wi)=>{const panel=document.createElement("section");panel.className="week-panel"+(wi===0?" active":"");panel.dataset.panel=w.week;panel.innerHTML=`<div class="week-head"><div><h2>Vecka ${w.week}</h2><p class="small">${w.subtitle}</p></div><span class="badge" id="badge${w.week}">0/3</span></div>`;w.passes.forEach((p,pi)=>{const id=`w${w.week}p${pi}`,card=document.createElement("label");card.className="pass-card"+(p.optional?" optional":"")+(state[id]?" done":"");card.innerHTML=`<input id="${id}" type="checkbox" data-week="${w.week}" data-optional="${p.optional}" ${state[id]?"checked":""}><span class="pass-main"><span class="pass-day">${formatDate(wi,p.offset,p.day)}</span><span class="pass-title">${p.title}${p.optional?'<span class="optional-chip">Valfritt</span>':''}</span><span class="pass-desc">${p.desc}</span></span>`;panel.appendChild(card)});panels.appendChild(panel)});document.querySelectorAll('input[type="checkbox"]').forEach(cb=>cb.addEventListener("change",()=>{state[cb.id]=cb.checked;localStorage.setItem(KEY,JSON.stringify(state));cb.closest(".pass-card").classList.toggle("done",cb.checked);update()}));update()}function update(){const all=[...document.querySelectorAll('input[type="checkbox"]')],main=all.filter(x=>x.dataset.optional==="false"),bonus=all.filter(x=>x.dataset.optional==="true"),mainChecked=main.filter(x=>x.checked).length,bonusChecked=bonus.filter(x=>x.checked).length;mainDone.textContent=mainChecked;bonusDone.textContent=bonusChecked;let completeWeeks=0;weeks.forEach(w=>{const checked=all.filter(x=>Number(x.dataset.week)===w.week&&x.dataset.optional==="false"&&x.checked).length;document.getElementById("badge"+w.week).textContent=`${checked}/3`;if(checked===3)completeWeeks++});weeksDone.textContent=completeWeeks;progressBar.style.width=Math.round(mainChecked/12*100)+"%";footerText.textContent=`${mainChecked} av 12 huvudpass`}document.querySelectorAll(".tab").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".week-panel").forEach(x=>x.classList.remove("active"));btn.classList.add("active");document.querySelector(`[data-panel="${btn.dataset.week}"]`).classList.add("active")}));startDate.addEventListener("change",()=>{localStorage.setItem(DATEKEY,startDate.value);render()});todayBtn.addEventListener("click",()=>{const d=new Date();startDate.value=d.toISOString().slice(0,10);localStorage.setItem(DATEKEY,startDate.value);render()});notes.value=localStorage.getItem(NOTESKEY)||"";notes.addEventListener("input",()=>localStorage.setItem(NOTESKEY,notes.value));resetBtn.addEventListener("click",()=>{if(!confirm("Vill du nollställa alla kryssningar och anteckningar?"))return;state={};localStorage.removeItem(KEY);localStorage.removeItem(NOTESKEY);notes.value="";render()});nextBtn.addEventListener("click",()=>{const all=[...document.querySelectorAll('input[type="checkbox"]')],next=all.find(x=>x.dataset.optional==="false"&&!x.checked)||all.find(x=>!x.checked);if(!next){alert("Alla pass är avklarade!");return}const panel=next.closest(".week-panel"),week=panel.dataset.panel;document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.week===week));document.querySelectorAll(".week-panel").forEach(x=>x.classList.toggle("active",x===panel));setTimeout(()=>next.closest(".pass-card").scrollIntoView({behavior:"smooth",block:"center"}),50)});render();</script></body></html>
